name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - run: gradle build
      - name: Package modpack
        run: |
          mkdir -p pack/overrides/mods
          cp $(ls build/libs/*.jar | grep -v sources) pack/overrides/mods/xiansky.jar
          URL=$(curl -s 'https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%221.20.1%22%5D&loaders=%5B%22fabric%22%5D' | jq -r '[.[] | select(.version_number=="0.92.2+1.20.1")][0].files[0].url')
          echo "Fabric API url: $URL"
          test "$URL" != "null" && test -n "$URL"
          curl -L -o pack/overrides/mods/fabric-api.jar "$URL"
          echo '{"minecraft":{"version":"1.20.1","modLoaders":[{"id":"fabric-0.15.11","primary":true}]},"manifestType":"minecraftModpack","manifestVersion":1,"name":"XianSky","version":"1.0.0","author":"you","files":[],"overrides":"overrides"}' > pack/manifest.json
          cd pack && zip -r ../XianSky-modpack.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: XianSky-modpack
          path: |
            XianSky-modpack.zip
            build/libs/xiansky-*.jar
